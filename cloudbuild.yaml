# Google Cloud Build Configuration
# Repository: https://github.com/Haaparanta/Junction-2025-Valmet-HSY-Flow-Optimization
# Builds combined Docker image (backend + frontend) and pushes to Artifact Registry

steps:
  # Create Artifact Registry repository if it doesn't exist
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud artifacts repositories describe ${_REPOSITORY} \
          --location=${_REGION} \
          --format="value(name)" || \
        gcloud artifacts repositories create ${_REPOSITORY} \
          --repository-format=docker \
          --location=${_REGION} \
          --description="Docker repository for Junction Valmet application"
    id: "create-repository"

  # Build combined Docker image (backend + frontend) from root Dockerfile
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/app:${SHORT_SHA}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/app:latest"
      - "."
    id: "build-app"
    waitFor: ["create-repository"]

  # Push combined image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/app"
    id: "push-app"
    waitFor: ["build-app"]

  # Deploy to Cloud Run (optional - uncomment if you want to deploy)
  # - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  #   entrypoint: gcloud
  #   args:
  #     - 'run'
  #     - 'deploy'
  #     - 'junction-valmet-app'
  #     - '--image'
  #     - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/app:${SHORT_SHA}'
  #     - '--region'
  #     - '${_REGION}'
  #     - '--platform'
  #     - 'managed'
  #     - '--port'
  #     - '8080'
  #     - '--allow-unauthenticated'
  #   id: 'deploy-app'
  #   waitFor: ['push-app']

# Substitution variables (set these in Cloud Build triggers or via gcloud)
substitutions:
  _REGION: "europe-north1" # Change to your preferred region
  _REPOSITORY: "junction-2025-valmet-hsy-flow-optimization" # Change to your Artifact Registry repository name (must be lowercase)

# Images to be pushed to the registry
images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/app:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/app:latest"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"
